[project]
name = "pyhrp"
version = "2.3.3"
description = "Cluster-based portfolio allocation: HRP, Schur risk parity, and 1/N"
authors = [{name = "Thomas Schmelzer", email = "thomas.schmelzer@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "plotly>=5,<7",
    "polars>=1.0,<2",
    "scipy>=1.11",
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/tschm/pyhrp"
Homepage = "https://tschm.github.io/pyhrp"
Changelog = "https://github.com/tschm/pyhrp/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "hypothesis>=6.150.0",
    "hypothesis[numpy]>=6.150.0",
    "kaleido>=1.3.0",
    "marimo>=0.14.9",
    "pytest-benchmark>=5.2.3",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-mock>=3.0",
    "pytest-xdist>=3.0",
    "pytest-timeout>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyhrp"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
# CLAUDE.md states 100% coverage as a CI-enforced invariant; keep the gate and
# the documented invariant identical so a regression cannot pass silently.
fail_under = 100

[tool.mypy]
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["scipy.*", "plotly.*"]
ignore_missing_imports = true

[tool.deptry]
package_module_name_map = {numpy = "numpy", scipy = "scipy", marimo = "marimo", polars = "polars", plotly = "plotly"}
ignore = ["DEP004"]
extend_exclude = [".rhiza"]

# bump-my-version searches .bumpversion.toml, .bumpversion.cfg, setup.cfg and
# pyproject.toml, in that order. The table has to live in one of them: with no
# discoverable config it silently falls back to `git describe`, so a release can
# be cut at a version that already exists.
#
# No `current_version` here on purpose — bump-my-version reads [project].version
# natively, and a second copy only drifts once it goes stale.
[tool.bumpversion]
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?:[-]?(?P<release>[a-z]+)[\\.]?(?P<pre_n>\\d+))?(?:\\+build\\.(?P<build_n>\\d+))?"
serialize = [
    "{major}.{minor}.{patch}-{release}.{pre_n}+build.{build_n}",
    "{major}.{minor}.{patch}+build.{build_n}",
    "{major}.{minor}.{patch}-{release}.{pre_n}",
    "{major}.{minor}.{patch}",
]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
allow_dirty = false
# The release flow commits and tags itself, so the changelog lands in the bump
# commit; a bare `bump-my-version bump` would otherwise add a second commit and
# a duplicate tag.
commit = false
tag = false

[tool.bumpversion.parts.release]
optional_value = "prod"
values = [
    "dev",
    "alpha",
    "a",  # PEP 440 short form for alpha
    "beta",
    "b",  # PEP 440 short form for beta
    "rc",
    "prod",
]

# Anchored to the [project] table on purpose. `search`/`replace` are applied to
# EVERY occurrence in the file, so the obvious `version = "{current_version}"`
# also rewrites any [tool.*] table that happens to share the current number.
[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = '(?ms)^\[project\]((?:(?!^\[)[\s\S])*?)^version = "{current_version}"'
replace = '[project]\1version = "{new_version}"'
