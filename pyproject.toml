[project]
name = "pyhrp"
version = "2.3.3"
description = "Cluster-based portfolio allocation: HRP, Schur risk parity, and 1/N"
authors = [{name = "Thomas Schmelzer", email = "thomas.schmelzer@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "plotly>=5,<7",
    "polars>=1.0,<2",
    "scipy>=1.11",
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/tschm/pyhrp"
Homepage = "https://tschm.github.io/pyhrp"
Changelog = "https://github.com/tschm/pyhrp/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "hypothesis>=6.150.0",
    "hypothesis[numpy]>=6.150.0",
    "kaleido>=1.3.0",
    "marimo>=0.14.9",
    "pytest-benchmark>=5.2.3",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-mock>=3.0",
    "pytest-xdist>=3.0",
    "pytest-timeout>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyhrp"]

[tool.rhiza-task]
# Settings for the task runner that replaced the synced make layer in rhiza v1.4.0.
# Read as layer 3 of rhiza-task's resolution order (defaults -> .rhiza/.env -> pyproject.toml -> RHIZA_* environment). Only entries that differ from the CLI's defaults belong here; `uvx rhiza-task print <setting>` shows what one resolves to.

# This repo keeps its Marimo notebooks in book/marimo, not the CLI default of docs/notebooks. `book` exports them to docs/notebooks/*.html, which is what mkdocs.yml's nav references, and rhiza_marimo.yml reads this setting via `rhiza-task print marimo_folder` to build its notebook matrix.
marimo-folder = "book/marimo"

# CLAUDE.md documents 100% coverage as a hard invariant. The `test` task passes --cov-fail-under on the command line, which outranks [tool.coverage.report] fail_under below, so leaving this at the default 90 would quietly weaken the gate while the config file still claimed 100. Keep the two in step.
coverage-fail-under = 100

# The retired python.mk had `TYPECHECKER ?= both`; the CLI defaults to `ty` alone, so a bare migration would have dropped `mypy --strict` from this repo's typecheck gate -- the one CLAUDE.md and the README describe. `both` is also stricter here than it was under make: the shell `case` let mypy's exit status win, so a ty failure could pass, where the CLI raises on each run.
typechecker = "both"

# The retired quality.mk pinned `RHIZA_CHECKS_VERSION ?= 0.2.1`; the CLI defaults to v0.2.0, so a bare migration would have *downgraded* the conformance checks -- the drift the pin exists to prevent. Bumping it is a separate upgrade decision.
pytest-rhiza = "pytest-rhiza @ git+https://github.com/Jebel-Quant/pytest-rhiza@v0.2.1"

# Not set, on purpose:
#   source-folder      -- the default `src` is already this repo's layout.
#   layers             -- `python` is detected from pyproject.toml.
#   mkdocs-extra-packages -- the old root Makefile carried `MKDOCS_EXTRA_PACKAGES = --with 'mkdocstrings[python]'` for the API reference; rhiza-task 0.3.1 makes mkdocstrings[python] the default, so the override is now redundant rather than lost. Restore it here if that default ever changes.

[tool.coverage.run]
branch = true

[tool.coverage.report]
# CLAUDE.md states 100% coverage as a CI-enforced invariant; keep the gate and the documented invariant identical so a regression cannot pass silently.
fail_under = 100

[tool.mypy]
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["scipy.*", "plotly.*"]
ignore_missing_imports = true

[tool.deptry]
package_module_name_map = {numpy = "numpy", scipy = "scipy", marimo = "marimo", polars = "polars", plotly = "plotly"}
ignore = [["DEP004"]]
extend_exclude = [".rhiza"]

[tool.bumpversion]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
allow_dirty = false
# The release flow commits and tags itself, so the changelog lands in the bump commit; a bare `bump-my-version bump` would otherwise add a second commit and a duplicate tag.
commit = false
tag = false

[[tool.bumpversion.parts.release]]
optional_value = "prod"
values = ["dev", "alpha", "a", "beta", "b", "rc", "prod"]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = '(?ms)^\\[project\\]((?:(?!^\\[)[\\s\\S])*?)^version = "{current_version}"'
replace = '[project]\\1version = "{new_version}"'
